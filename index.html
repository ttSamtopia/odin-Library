<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Library</title>
</head>
<body>
    <div id="header">
        <h1>Your digital library</h1>
        <button command="show-modal" commandfor="new-book-modal">New Book</button>
    </div>
    <dialog id="new-book-modal">
        <form method="dialog">
            <label for="title">Title:</label>
            <input type="text" id="title" required>
            <label for="author">Author:</label>
            <input type="text" id="author" required>
            <label for="nPages">Number of Pages:</label>
            <input type="number" id="nPages" required>
            <label for="readStatus">Read?</label>
            <input type="checkbox" id="readStatus">
            <button type="submit">Add Book</button>
        </form>
    </dialog>
    <div id="library-container"></div>

    <script src="./main.js"></script>
</body>
</html>
