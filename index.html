<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Library</title>
</head>
<body>
    <div id="header">
        <h1>Your digital library</h1>
        <button command="show-modal" commandfor="new-book-modal">New Book</button>
    </div>
    <dialog id="new-book-modal">
        <form method="dialog">
            <div>
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required autofocus>
            </div>
            <div>
                <label for="author">Author:</label>
                <input type="text" id="author" name="author" required>
            </div>
            <div>
                <label for="nPages">Number of Pages:</label>
                <input type="number" id="nPages" name="nPages" required>
            </div>
            <div id="readFormContainer">
                <label>Read?</label>
                <div id="readCheckContainer">
                    <label for="readStatusYes" class="readCheck">
                        <label for="readStatusYes">Yes:</label>
                        <input type="radio" name="readStatus" id="readStatusYes" value="true">
                    </label>
                    <label for="readStatusNo" class="readCheck">
                        <label for="readStatusNo">No:</label>
                        <input type="radio" name="readStatus" id="readStatusNo" value="false">
                    </label>
                </div>
            </div>
            <button type="submit">Add Book</button>
        </form>
    </dialog>
    <div id="library-container"></div>

    <script src="./main.js"></script>
</body>
</html>
